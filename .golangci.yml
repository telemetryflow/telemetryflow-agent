# GolangCI-Lint Configuration (v2)
# TelemetryFlow Agent - AI-Powered Observability & Incident Response Management (IRM) Platform

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - staticcheck
    - govet
    - errcheck
    - ineffassign
    - unused
  exclusions:
    paths:
      - vendor
      - internal/collector/ebpf
    rules:
      - path: "tests/mocks/"
        linters:
          - staticcheck
