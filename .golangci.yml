# GolangCI-Lint Configuration
# TelemetryFlow Agent - Community Enterprise Observability Platform (CEOP)

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - staticcheck
    - govet
    - errcheck
    - ineffassign
    - unused

issues:
  exclude-dirs:
    - vendor
    - internal/collector/ebpf
  exclude-rules:
    - path: "tests/mocks/"
      linters:
        - staticcheck
