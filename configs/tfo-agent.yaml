# =============================================================================
# TelemetryFlow Agent Configuration — OTel Export + Fluent Bit Logs
# =============================================================================
# Minimal production config: Fluent Bit for log collection, OTLP/HTTP for
# telemetry export to the TFO Platform. No other collectors, no integrations.
#
# Full reference (all collectors, outputs, integrations):
#   configs/tfo-agent-full.yaml
# Other minimal starting points:
#   configs/examples/vm-minimal.yaml   — host metrics (system + node_exporter)
#   configs/examples/k8s-minimal.yaml  — Kubernetes monitoring
#
# Usage:
#   1. Copy to /etc/tfo-agent/tfo-agent.yaml
#   2. Set env vars:
#        TELEMETRYFLOW_API_KEY_ID=tfk_xxx
#        TELEMETRYFLOW_API_KEY_SECRET=tfs_xxx
#   3. Start: tfo-agent --config /etc/tfo-agent/tfo-agent.yaml
# =============================================================================

# -----------------------------------------------------------------------------
# TFO Platform Connection
# -----------------------------------------------------------------------------
telemetryflow:
  api_key_id: "${TELEMETRYFLOW_API_KEY_ID}"
  api_key_secret: "${TELEMETRYFLOW_API_KEY_SECRET}"

  # OTLP ingestion endpoint — agent appends /v2/{metrics,traces,logs}
  endpoint: "${TELEMETRYFLOW_ENDPOINT:-http://localhost:4318}"

  # Backend REST API (heartbeat, agent registration) — must include /api/v2
  backend_endpoint: "${TELEMETRYFLOW_BACKEND_ENDPOINT:-http://localhost:3000/api/v2}"

  # Protocol: grpc or http (lowercase only — validation is case-sensitive)
  protocol: "${TELEMETRYFLOW_PROTOCOL:-http}"

  tls:
    enabled: false
    skip_verify: true
    # ca_file: /path/to/ca.crt

  timeout: 30s
  retry:
    enabled: true
    max_attempts: 3
    initial_interval: 1s
    max_interval: 30s

# -----------------------------------------------------------------------------
# Agent Identity
# -----------------------------------------------------------------------------
agent:
  # Auto-generated via host fingerprint when empty
  id: "${TELEMETRYFLOW_AGENT_ID:-}"
  # Auto-detected via os.Hostname() when empty
  hostname: ""
  name: "${TELEMETRYFLOW_AGENT_NAME:-tfo-agent}"

  tags:
    environment: "${TELEMETRYFLOW_ENVIRONMENT:-production}"

# -----------------------------------------------------------------------------
# Heartbeat
# -----------------------------------------------------------------------------
heartbeat:
  interval: 60s
  timeout: 10s
  include_system_info: true

# -----------------------------------------------------------------------------
# Collectors — Fluent Bit only
# -----------------------------------------------------------------------------
collectors:
  # Fluent Bit runs as a managed subprocess; logs flow through the OTLP
  # logs pipeline (exporter.otlp.logs below). Replaces the native `logs`
  # collector. Requires the fluent-bit binary in PATH (binary_path
  # auto-detects) — on Docker use the tfo-agent image, which bundles it.
  fluent_bit:
    enabled: false
    binary_path: ""                     # auto-detect from PATH
    config_dir: /tmp/tfo-agent-fluentbit
    flush_interval: 5
    log_level: info
    storage_enabled: true               # disk-backed buffering inside Fluent Bit
    health_check: true
    health_port: 2020
    restart_on_crash: true
    restart_delay: 5s
    max_restarts: 0                     # 0 = unlimited

    # External config mode: use your own fluent-bit.conf as-is instead of the
    # auto-generated one. Your file must define its own [OUTPUT].
    # external_config: true
    # config_file: /etc/fluent-bit/fluent-bit.conf

    tail:
      enabled: true
      paths:
        - /var/log/syslog              # Debian/Ubuntu
        - /var/log/messages            # RHEL/CentOS
        # - /var/log/containers/*.log  # Kubernetes (CRI runtime)
      multiline_parser: "docker,cri"
      read_from_head: false
      refresh_interval: 10
      rotate_wait: 5

    # systemd journal (Linux only) — disabled when units are unavailable
    systemd:
      enabled: false
      units: [docker, containerd]
      strip_underscores: true

    # Kubernetes log enrichment — auto-detect from KUBERNETES_SERVICE_HOST
    kubernetes:
      enabled: false
      log_path: /var/log/containers/*.log
      merge_log: true
      keep_log: false
      k8s_logging_parser: true

# -----------------------------------------------------------------------------
# Exporter — OTLP HTTP to TFO Platform
# -----------------------------------------------------------------------------
exporter:
  otlp:
    enabled: true
    protocol: http
    batch_size: 100
    flush_interval: 10s
    compression: gzip

    # v1: /v1/* (OTEL community) | v2: /v2/* (TFO Platform enhanced)
    endpoint_version: v2

    # Logs from Fluent Bit
    logs:
      enabled: true

    # Metrics — enable when you add metric collectors (system, node_exporter…)
    metrics:
      enabled: true

    # Traces — no trace source in this config
    traces:
      enabled: false

# -----------------------------------------------------------------------------
# Buffer — disk-backed retry for OTLP export during outages
# -----------------------------------------------------------------------------
buffer:
  enabled: true
  path: /var/lib/tfo-agent/buffer
  max_size_mb: 50
  max_age: 24h
  flush_interval: 5s

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging:
  level: info
  format: json             # text for console debugging

# =============================================================================
# Intentionally omitted (defaults apply) — see configs/tfo-agent-full.yaml:
#   collectors.*        — system, node_exporter, k8s, docker, DBs, caches…
#   outputs             — prometheus_remote_write, file, kafka, loki…
#   qan                 — per-query analytics
#   pipeline            — processors / aggregators
#   integrations        — 35+ third-party exports
#   security, auto_update, retention, resources, cache, persister
# =============================================================================
