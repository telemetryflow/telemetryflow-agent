# TelemetryFlow Agent - Prometheus Scraper Collector Configuration
#
# Example configuration for scraping Prometheus-style /metrics endpoints.
# Supports static targets, TLS, basic auth, bearer tokens,
# and metric relabeling.

prometheus_scraper:
  enabled: true

  scrape_jobs:
    # Static target — application metrics
    - job_name: "my-app"
      enabled: true
      static_targets:
        - "localhost:8080"
      scrape_interval: 15s
      scrape_path: "/metrics"
      scrape_timeout: 10s
      honor_labels: false

    # TLS-secured target with bearer token
    # - job_name: "secure-service"
