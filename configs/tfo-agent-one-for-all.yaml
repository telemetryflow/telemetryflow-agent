# TFO-Agent One-For-All Configuration
# Replaces: Prometheus, metrics-server, kube-state-metrics, node-exporter

one_for_all:
  enabled: true

collectors:
  node_exporter:
    enabled: true
    cpu: true
    memory: true
    diskio: true
    filesystem: true
    network: true
    loadavg: true

  kubernetes:
    enabled: true
    nodes: true
    pods: true
    deployments: true
    workloads: true
    storage: true
    services: true
    hpa: true
    pdb: true
    events: true
    metrics_api: true
    # KSM gaps (new)
    resource_quotas: true
    limit_ranges: true
    pod_conditions: true
    node_taints: true
    workload_generations: true

  prometheus_scraper:
    enabled: true
    scrape_jobs:
      - job_name: example-app
        enabled: true
        static_targets:
          - "my-app-service:8080"
        scrape_interval: 60s
        scrape_path: /metrics

  remote_write_receiver:
    enabled: true
    port: 9091

prometheus_server:
  enabled: true
  port: 9090
  path: /metrics
