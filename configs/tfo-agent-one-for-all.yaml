# TFO-Agent One-For-All Configuration
# Replaces: Prometheus, metrics-server, kube-state-metrics, node-exporter

one_for_all:
  enabled: true

collectors:
  node_exporter:
    enabled: true
    cpu: true
    memory: true
    diskio: true
    filesystem: true
    network: true
    loadavg: true

  kubernetes:
    enabled: true
    nodes: true
    pods: true
    deployments: true
    workloads: true
    storage: true
    services: true
    hpa: true
    pdb: true
    events: true
    metrics_api: true
    # KSM gaps
    resource_quotas: true
    limit_ranges: true
    pod_conditions: true
    node_taints: true
    workload_generations: true
    # Extended metrics — full observability without external tools
    apiserver_metrics: true
    coredns_metrics: true
    coredns_service: "kube-dns.kube-system.svc.cluster.local:9153"
    container_extended_metrics: true
    pv_io_stats: true
    # Pod & node logs
    pod_logs: true
    pod_logs_tail_lines: 100
    node_logs: true
    node_logs_tail_lines: 200
    node_log_sources: [kubelet, kube-proxy, containerd]

  # Fluent Bit — production-grade log collection (replaces native logs)
  fluent_bit:
    enabled: false # enable when fluent-bit binary is available
    config_dir: /tmp/tfo-agent-fluentbit
    flush_interval: 5
    log_level: info
    storage_enabled: true
    health_check: true
    restart_on_crash: true
    tail:
      enabled: true
      paths: ["/var/log/syslog", "/var/log/messages"]
      multiline_parser: "docker,cri"
    systemd:
      enabled: true
      units: [kubelet, docker, containerd]
    kubernetes:
      enabled: false # auto-detected
      log_path: /var/log/containers/*.log
      merge_log: true

  prometheus_scraper:
    enabled: true
    scrape_jobs:
      - job_name: example-app
        enabled: true
        static_targets:
          - "my-app-service:8080"
        scrape_interval: 60s
        scrape_path: /metrics

  remote_write_receiver:
    enabled: true
    port: 9091

prometheus_server:
  enabled: true
  port: 9090
  path: /metrics
