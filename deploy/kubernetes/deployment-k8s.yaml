---
# TFO-Agent K8s Cluster Collector Deployment
# Runs as a single replica (not DaemonSet) — collects cluster-wide Kubernetes state
# and syncs it to the TFO Platform backend via REST API.
#
# Auto-registration: on startup the agent calls POST /api/v2/monitoring/kubernetes/clusters/agent-register
# (find-or-create semantics) — safe to restart/redeploy without manual pre-registration.
#
# Trivy suppression annotations:
# trivy:ignore:KSV-0121 — hostPath mount for / is required for cluster provider
# auto-detection (checks /var/lib/rancher/k3s, /var/lib/rancher/rke2, etc.)
#
# Pre-requisites:
#   kubectl create secret generic tfo-agent-credentials \
#     --from-literal=api-key-id=tfk_xxx \
#     --from-literal=api-key-secret=tfs_xxx \
#     -n telemetryflow
#
# Optional — skip auto-registration by pre-setting the cluster UUID:
#   kubectl create secret generic tfo-agent-credentials \
#     --from-literal=api-key-id=tfk_xxx \
#     --from-literal=api-key-secret=tfs_xxx \
#     --from-literal=k8s-cluster-id=<uuid-from-tfo-platform> \
#     -n telemetryflow

apiVersion: apps/v1
kind: Deployment
metadata:
  name: tfo-agent-k8s
  namespace: telemetryflow
  labels:
    app.kubernetes.io/name: tfo-agent
    app.kubernetes.io/component: k8s-collector
    app.kubernetes.io/part-of: telemetryflow
spec:
  replicas: 1 # exactly 1 — multiple replicas would duplicate cluster state syncs
  selector:
    matchLabels:
      app.kubernetes.io/name: tfo-agent
      app.kubernetes.io/component: k8s-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tfo-agent
        app.kubernetes.io/component: k8s-collector
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8888"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: tfo-agent
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      # Wait for tfo-backend to be ready before starting the agent.
      # The K8s collector performs auto-registration on startup (POST /clusters/agent-register).
      # If the backend is not yet up, registration fails and k8sSync is never created —
      # meaning no K8s state is ever synced until the pod is manually restarted.
      initContainers:
        - name: wait-for-backend
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -qO- http://tfo-backend.telemetryflow.svc.cluster.local:3100/health >/dev/null 2>&1; do
                echo "Waiting for tfo-backend..."; sleep 5
              done
              echo "tfo-backend is ready."
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL

      containers:
        - name: tfo-agent
          image: telemetryflow/telemetryflow-agent:1.3.2
          imagePullPolicy: Always

          args:
            - start
            - --config
            - /etc/tfo-agent/tfo-agent.yaml

          ports:
            - name: metrics
              containerPort: 8888
              protocol: TCP

          env:
            # Pod identity
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

            # TFO Platform endpoint — MUST point to backend REST API (port 3100), NOT OTLP collector (port 4317)
            # The agent uses this for: heartbeat, auto-registration of cluster, K8s state sync
            - name: TELEMETRYFLOW_ENDPOINT
              value: "http://tfo-backend.telemetryflow.svc.cluster.local:3100/api/v2"

            # API credentials from Secret
            - name: TELEMETRYFLOW_API_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: tfo-agent-credentials
                  key: api-key-id
                  optional: false
            - name: TELEMETRYFLOW_API_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: tfo-agent-credentials
                  key: api-key-secret
                  optional: false

            # Optional: pre-registered cluster UUID — skip auto-registration
            # If not set, the agent will auto-register on startup (find-or-create).
            - name: TELEMETRYFLOW_K8S_CLUSTER_ID
              valueFrom:
                secretKeyRef:
                  name: tfo-agent-credentials
                  key: k8s-cluster-id
                  optional: true

            # Per-workload collector toggles
            - name: TELEMETRYFLOW_K8S_ENABLED
              value: "true"
            - name: TELEMETRYFLOW_NODE_EXPORTER_ENABLED
              value: "false" # node metrics handled by tfo-agent DaemonSet

            # Prometheus server for liveness/readiness probes
            - name: TELEMETRYFLOW_PROMETHEUS_ENABLED
              value: "true"
            - name: TELEMETRYFLOW_PROMETHEUS_PORT
              value: "8888"

            # Cluster identity — used in auto-registration name and OTEL resource attributes
            - name: CLUSTER_NAME
              value: "" # override with your cluster name; auto-detected from hostname if empty
            - name: ENVIRONMENT
              value: "production"

            # Host filesystem root — used by cluster provider auto-detection
            # (checks /var/lib/rancher/k3s, /var/lib/rancher/rke2, etc.)
            - name: TELEMETRYFLOW_HOST_ROOT
              value: /hostfs

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi

          # startupProbe: 90s budget for first-boot cluster auto-registration REST call
          startupProbe:
            httpGet:
              path: /metrics
              port: 8888
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 18

          livenessProbe:
            httpGet:
              path: /metrics
              port: 8888
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /metrics
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          volumeMounts:
            - name: config
              mountPath: /etc/tfo-agent
              readOnly: true
            - name: buffer
              mountPath: /var/lib/tfo-agent/buffer
            # Host filesystem — needed for cluster provider auto-detection heuristics
            - name: hostfs
              mountPath: /hostfs
              readOnly: true
              mountPropagation: HostToContainer

          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL

      volumes:
        - name: config
          configMap:
            name: tfo-agent-k8s-config
        - name: buffer
          emptyDir:
            sizeLimit: 100Mi
        - name: hostfs
          hostPath:
            path: /
