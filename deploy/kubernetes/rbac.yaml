---
# TFO-Agent RBAC Configuration
# Provides read-only access to Kubernetes resources for metrics collection
# and kubelet /stats/summary for network metrics.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: tfo-agent
  namespace: telemetryflow
  labels:
    app.kubernetes.io/name: tfo-agent
    app.kubernetes.io/component: monitoring

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tfo-agent
  labels:
    app.kubernetes.io/name: tfo-agent
    app.kubernetes.io/component: monitoring
rules:
  # Core resources — state + metadata
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/stats   # kubelet /stats/summary (network bytes per namespace)
      - nodes/proxy   # kubelet /stats/summary proxy (direct kubelet access)
      - pods
      - services
      - endpoints
      - namespaces
      - events
      - persistentvolumes
      - persistentvolumeclaims
      - resourcequotas
      - configmaps
      - secrets
    verbs: ["get", "list", "watch"]

  # Apps workloads
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["get", "list", "watch"]

  # Batch workloads
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]

  # Autoscaling
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch"]

  # Networking — Ingresses + EndpointSlices (replaces deprecated v1/Endpoints in K8s 1.33+)
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs: ["get", "list", "watch"]

  # Storage classes
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
      - volumeattachments
    verbs: ["get", "list", "watch"]

  # Events API (events.k8s.io/v1 replaces core/v1 events in K8s 1.19+)
  - apiGroups: ["events.k8s.io"]
    resources:
      - events
    verbs: ["get", "list", "watch"]

  # Metrics-server — actual CPU/Memory usage per node and pod
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - nodes
      - pods
    verbs: ["get", "list"]

  # Non-resource URLs — Prometheus metrics from kubelet/cAdvisor
  - nonResourceURLs:
      - /metrics
      - /metrics/cadvisor
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tfo-agent
  labels:
    app.kubernetes.io/name: tfo-agent
    app.kubernetes.io/component: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tfo-agent
subjects:
  - kind: ServiceAccount
    name: tfo-agent
    namespace: telemetryflow
