---
# TFO-Agent DaemonSet
# Runs one agent pod per node for per-node OS metrics (node_exporter).
# Kubernetes cluster state is collected separately by deployment-k8s.yaml.
#
# Trivy suppression annotations:
# trivy:ignore:KSV-0121 — hostPath mounts for /, /proc, /sys are required by
# node_exporter to collect host-level OS metrics (CPU, disk, network, etc.)

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: tfo-agent
  namespace: telemetryflow
  labels:
    app.kubernetes.io/name: tfo-agent
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: telemetryflow
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tfo-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tfo-agent
        app.kubernetes.io/component: monitoring
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8888"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: tfo-agent
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      # Tolerate all taints to run on every node (including control-plane)
      tolerations:
        - operator: Exists

      # Run on Linux nodes only
      nodeSelector:
        kubernetes.io/os: linux

      # Wait for tfo-backend to be ready before starting the agent.
      # This prevents heartbeat/auth failures on cluster cold-start when the agent
      # pod comes up before the backend service is accepting requests.
      initContainers:
        - name: wait-for-backend
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -qO- http://tfo-backend.telemetryflow.svc.cluster.local:3100/health >/dev/null 2>&1; do
                echo "Waiting for tfo-backend..."; sleep 5
              done
              echo "tfo-backend is ready."
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL

      containers:
        - name: tfo-agent
          image: telemetryflow/telemetryflow-agent:1.3.1
          imagePullPolicy: Always

          args:
            - start
            - --config
            - /etc/tfo-agent/tfo-agent.yaml

          ports:
            - name: metrics
              containerPort: 8888
              protocol: TCP

          env:
            # Downward API — node and pod identity
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Direct gopsutil to read host's /etc and /proc so that machine-id
            # and other OS-level identifiers are read from the node, not the container.
            # Required for stable UUIDv5 fingerprint across pod restarts.
            - name: HOST_PROC
              value: /host/proc
            - name: HOST_ETC
              value: /host/root/etc
            - name: HOST_SYS
              value: /host/sys
            - name: HOST_VAR
              value: /host/root/var
            - name: HOST_RUN
              value: /host/root/run
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

            # TFO Platform endpoint — must point to backend REST API (NOT the OTLP collector port)
            # The agent uses this URL for: heartbeat, cluster auto-registration, and K8s state sync.
            # Format: http://<backend-service>:<port>/api/v2
            - name: TELEMETRYFLOW_ENDPOINT
              value: "http://tfo-backend.telemetryflow.svc.cluster.local:3100/api/v2"

            # API credentials from Secret
            # Create secret: kubectl create secret generic tfo-agent-credentials \
            #   --from-literal=api-key-id=tfk_xxx \
            #   --from-literal=api-key-secret=tfs_xxx \
            #   -n telemetryflow
            - name: TELEMETRYFLOW_API_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: tfo-agent-credentials
                  key: api-key-id
                  optional: false
            - name: TELEMETRYFLOW_API_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: tfo-agent-credentials
                  key: api-key-secret
                  optional: false

            # Per-workload collector toggles (override YAML config)
            - name: TELEMETRYFLOW_NODE_EXPORTER_ENABLED
              value: "true"
            - name: TELEMETRYFLOW_K8S_ENABLED
              value: "false" # K8s state handled by tfo-agent-k8s Deployment (deployment-k8s.yaml)

            # Prometheus server for liveness/readiness probes
            - name: TELEMETRYFLOW_PROMETHEUS_ENABLED
              value: "true"
            - name: TELEMETRYFLOW_PROMETHEUS_PORT
              value: "8888"

            # Host filesystem root — used by cloud/cluster provider auto-detection heuristics
            # (checks /var/lib/rancher/rke2, /var/lib/rancher/k3s, /sys/class/dmi/id/*, etc.)
            # Must match the mountPath of the 'root' hostPath volume below.
            - name: TELEMETRYFLOW_HOST_ROOT
              value: /host/root

            # Cluster and environment tags for OTEL resource attributes
            - name: CLUSTER_NAME
              value: "" # override with your cluster name, or auto-detected from hostname
            - name: ENVIRONMENT
              value: "production"

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi

          livenessProbe:
            httpGet:
              path: /metrics
              port: 8888
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /metrics
              port: 8888
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          volumeMounts:
            - name: config
              mountPath: /etc/tfo-agent
              readOnly: true
            - name: buffer
              mountPath: /var/lib/tfo-agent/buffer
            # Host filesystem for node_exporter metrics
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: root
              mountPath: /host/root
              readOnly: true
              mountPropagation: HostToContainer
            # Host log mounts for Fluent Bit / native log collector
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlogcontainers
              mountPath: /var/log/containers
              readOnly: true
            - name: fluentbit-storage
              mountPath: /tmp/tfo-agent-fluentbit

          securityContext:
            runAsUser: 0 # required to read /proc and /sys for node metrics
            runAsGroup: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
              add:
                - SYS_PTRACE # process inspection for node metrics

      volumes:
        - name: config
          configMap:
            name: tfo-agent-config
        - name: buffer
          emptyDir:
            sizeLimit: 200Mi
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: root
          hostPath:
            path: /
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlogcontainers
          hostPath:
            path: /var/log/containers
        - name: fluentbit-storage
          emptyDir:
            sizeLimit: 200Mi
