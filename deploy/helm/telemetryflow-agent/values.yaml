# TFO-Agent Helm Chart Values

# -- One-for-all mode: enables all four new capabilities with sensible defaults.
oneForAll:
  enabled: false

# -- TFO Platform connection settings (REQUIRED)
telemetryflow:
  # -- TFO Platform API endpoint (e.g. https://platform.example.com)
  endpoint: ""
  # -- API key ID (from TFO Platform → Settings → API Keys)
  apiKeyId: ""
  # -- API key secret
  apiKeySecret: ""
  # -- Workspace ID (optional — multi-workspace setups)
  workspaceId: ""
  # -- Tenant ID (optional — multi-tenant setups)
  tenantId: ""

# -- Cluster / environment identity (injected as env vars into all containers)
clusterName: ""
environment: production

# -- Container image settings
image:
  repository: ghcr.io/telemetryflow/tfo-agent
  pullPolicy: IfNotPresent
  tag: "" # Defaults to Chart.appVersion

imagePullSecrets: []

# -- Host network for node-level metrics (required for accurate network stats)
hostNetwork: true
dnsPolicy: ClusterFirstWithHostNet

# -- Ports exposed by the agent
ports:
  otlpGrpc: 4317
  otlpHttp: 4318
  metrics: 8888
  health: 13133
  agentApi: 8889

# -- Agent HTTP API server (real-time K8s queries: pod log streaming)
agentApi:
  enabled: true
  port: 8889

# -- ServiceAccount settings
serviceAccount:
  create: true
  name: ""
  annotations: {}

# -- RBAC (ClusterRole + ClusterRoleBinding)
rbac:
  create: true
  clusterRole: true
  rules:
    - apiGroups: [""]
      resources:
        - pods
        - namespaces
        - nodes
        - nodes/stats
        - nodes/proxy
        - services
        - replicationcontrollers
        - events
        - persistentvolumes
        - persistentvolumeclaims
        - resourcequotas
      verbs: ["get", "list", "watch"]
    - apiGroups: ["apps"]
      resources: ["replicasets", "deployments", "statefulsets", "daemonsets"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["batch"]
      resources: ["jobs", "cronjobs"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["autoscaling"]
      resources: ["horizontalpodautoscalers"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["networking.k8s.io"]
      resources: ["ingresses"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["storage.k8s.io"]
      resources: ["storageclasses", "volumeattachments"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["discovery.k8s.io"]
      resources: ["endpointslices"]
      verbs: ["get", "list", "watch"]
    - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
      verbs: ["get"]

# -- Node DaemonSet toggle
nodeCollector:
  enabled: true

# -- Kubernetes cluster collector (Deployment, 1 replica)
kubernetesCollector:
  enabled: true
  replicaCount: 1
  # -- Cluster name sent to TFO Platform (auto-detected from CLUSTER_NAME env if empty)
  clusterName: ""
  # -- Kubernetes provider hint (eks, gke, aks, rancher, k3s, kubesphere, etc.)
  clusterProvider: ""
  # -- TFO cluster UUID — auto-registered on startup if empty (find-or-create)
  clusterId: ""

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# -- Pod-level security context (node DaemonSet needs root for host metrics)
podSecurityContext:
  runAsUser: 0
  runAsGroup: 0
  fsGroup: 0
  seccompProfile:
    type: RuntimeDefault

# -- Container security context for node DaemonSet
nodeCollectorSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
    add: ["SYS_PTRACE"]

# -- Container security context for K8s cluster Deployment
kubernetesCollectorSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# -- Resource limits for node DaemonSet pods
nodeCollectorResources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# -- Tolerations for DaemonSet (run on all nodes including control-plane)
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule
  - key: node.kubernetes.io/not-ready
    operator: Exists
    effect: NoExecute
    tolerationSeconds: 300
  - key: node.kubernetes.io/unreachable
    operator: Exists
    effect: NoExecute
    tolerationSeconds: 300

# -- Node selector for all pods
nodeSelector: {}

# -- Affinity rules
affinity: {}

# -- Annotations added to all pods
podAnnotations: {}

# -- Additional labels added to all resources
commonLabels: {}

# -- Extra environment variables injected into all agent containers
extraEnv: []
# - name: MY_VAR
#   value: "my-value"

# -- Extra volumes to add to the DaemonSet/Deployment pod spec
extraVolumes: []
# - name: bearer-token
#   secret:
#     secretName: my-secret

# -- Extra volume mounts to add to the agent container
extraVolumeMounts: []
# - name: bearer-token
#   mountPath: /etc/tfo-agent/secrets
#   readOnly: true

# -- Priority class for all pods
priorityClassName: ""

# -- Base config for node DaemonSet (auth/endpoint come from env vars — managed by Viper)
config:
  agent:
    description: "TFO Agent - ${NODE_NAME}"
    tags:
      environment: "${ENVIRONMENT}"
      cluster: "${CLUSTER_NAME}"

  heartbeat:
    interval: 60s
    timeout: 10s
    include_system_info: true

  collectors:
    # Per-node OS metrics — toggled ON via TELEMETRYFLOW_NODE_EXPORTER_ENABLED env var
    node_exporter:
      enabled: true
      interval: 15s
      cpu: true
      memory: true
      disk_io: true
      filesystem: true
      network: true
      load_avg: true
      thermal: false
      textfile: false
      conntrack: false
      psi: false
      vmstat: false
      sockstat: false

    # Native log collector (file tailing + journald)
    logs:
      enabled: false
      paths: []
      include_patterns: []
      exclude_patterns: []

    # Fluent Bit log collector (production-grade, bundled in image)
    fluent_bit:
      enabled: true
      config_dir: /tmp/tfo-agent-fluentbit
      flush_interval: 5
      log_level: info
      storage_enabled: true
      health_check: true
      restart_on_crash: true
      tail:
        enabled: true
        paths: []
        multiline_parser: "docker,cri"
      systemd:
        enabled: true
        units: [kubelet, docker, containerd]
      kubernetes:
        enabled: false
        log_path: /var/log/containers/*.log
        merge_log: true

    # Kubernetes cluster monitoring — toggled OFF for DaemonSet via env var
    kubernetes:
      enabled: false

    # ClickHouse database monitoring collector
    clickhouse:
      enabled: false
      collection_interval: 15s
      query_log_interval: 60s
      max_query_log_rows: 10000
      instances: []
      # instances:
      #   - name: "production-clickhouse"
      #     host: "clickhouse.example.com"
      #     http_port: 8123
      #     native_port: 9000
      #     username: "default"
      #     password: ""
      #     database: "default"
      #     cluster_name: "default"
      #     shard_num: 1
      #     replica_name: "replica1"
      #     tls:
      #       enabled: false
      #     connect_timeout: 10s
      #     query_timeout: 30s

    prometheus_scraper:
      enabled: false
      scrape_jobs: []

    remote_write_receiver:
      enabled: false
      port: 9091
      basic_auth: {}

  prometheus_server:
    enabled: true
    port: 8888
    path: /metrics

  exporter:
    otlp:
      enabled: true
      batch_size: 100
      flush_interval: 10s
      compression: gzip

  buffer:
    enabled: true
    max_size_mb: 100
    path: /var/lib/tfo-agent/buffer
    flush_interval: 30s

  logging:
    level: info
    format: json

# -- Config override for the K8s cluster collector Deployment
kubernetes:
  config:
    agent:
      description: "TFO K8s Collector - ${CLUSTER_NAME}"
      tags:
        environment: "${ENVIRONMENT}"
        cluster: "${CLUSTER_NAME}"

    heartbeat:
      interval: 60s
      timeout: 10s

    collectors:
      # Node exporter OFF for K8s collector Deployment
      node_exporter:
        enabled: false

      # Kubernetes cluster monitoring ON — toggled via TELEMETRYFLOW_K8S_ENABLED env var
      kubernetes:
        enabled: true
        interval: 30s
        sync_to_backend: true
        sync_interval: 60s
        sync_timeout: 50s # per-request POST deadline; raise for large clusters
        nodes: true
        pods: true
        deployments: true
        namespaces_collect: true
        storage: true
        services: true
        workloads: true
        events: true
        resource_counts: true
        network: true
        metrics_api: true
        hpa: true
        pdb: true
        pod_logs: true
        pod_logs_tail_lines: 100
        pod_logs_namespaces: []
        node_logs: true
        node_logs_tail_lines: 200
        node_log_sources: [kubelet, kube-proxy, containerd]
        exclude_namespaces:
          - kube-system
        # Extended metrics — TFO Agent collects directly (replaces Prometheus stack)
        apiserver_metrics: true # Scrape kube-apiserver /metrics
        coredns_metrics: true # Scrape CoreDNS /metrics
        coredns_service: "" # Auto-discover via pod labels (supports vanilla k8s, EKS, GKE, AKS, RKE2, k3s)
        container_extended_metrics: true # cpu_throttled, memory_working_set, oom (via Kubelet)
        pv_io_stats: true # PV usage + IOPS (via Kubelet volume stats)
        # KSM gaps (new — all default false, enabled by oneForAll.enabled)
        resource_quotas: false
        limit_ranges: false
        pod_conditions: false
        node_taints: false
        workload_generations: false
        kubelet_skip_verify: false

    prometheus_server:
      enabled: true
      port: 8888
      path: /metrics

    exporter:
      otlp:
        enabled: false

    buffer:
      enabled: true
      max_size_mb: 50
      path: /var/lib/tfo-agent/buffer
      flush_interval: 30s

    logging:
      level: info
      format: json

# -- PodDisruptionBudget
podDisruptionBudget:
  enabled: false
  minAvailable: 1
