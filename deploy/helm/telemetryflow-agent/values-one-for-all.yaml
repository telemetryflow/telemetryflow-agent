# TFO-Agent One-For-All Preset
# Usage: helm install tfo-agent ./deploy/helm/tfo-agent -f values-one-for-all.yaml

oneForAll:
  enabled: true

nodeCollectorResources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

kubernetesCollector:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

config:
  collectors:
    node_exporter:
      enabled: true

    kubernetes:
      enabled: false # overridden to true in kubernetes.config section below

    prometheus_scraper:
      enabled: true
      scrape_jobs: [] # user fills in their targets

    remote_write_receiver:
      enabled: true
      port: 9091

    # Fluent Bit for node-level log collection
    fluent_bit:
      enabled: false
      config_dir: /tmp/tfo-agent-fluentbit
      tail:
        enabled: true
        paths: ["/var/log/syslog", "/var/log/messages"]
        multiline_parser: "docker,cri"
      systemd:
        enabled: true
        units: [kubelet, docker, containerd]
      kubernetes:
        enabled: false

kubernetes:
  config:
    collectors:
      kubernetes:
        enabled: true
        resource_quotas: true
        limit_ranges: true
        pod_conditions: true
        node_taints: true
        workload_generations: true
        metrics_api: true
        pod_logs: true
        pod_logs_tail_lines: 100
        node_logs: true
        node_logs_tail_lines: 200
        node_log_sources: [kubelet, kube-proxy, containerd]
        # Extended metrics — full observability without external tools
        apiserver_metrics: true
        coredns_metrics: true
        coredns_service: "" # Auto-discover via pod labels (supports vanilla k8s, EKS, GKE, AKS, RKE2, k3s)
        container_extended_metrics: true
        pv_io_stats: true
