{{- if .Values.kubernetesCollector.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tfo-agent.fullname" . }}-k8s
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tfo-agent.k8sCollector.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.kubernetesCollector.replicaCount }}
  selector:
    matchLabels:
      {{- include "tfo-agent.k8sCollector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tfo-agent.k8sCollector.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ toYaml .Values.kubernetes.config | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "tfo-agent.serviceAccountName" . }}
      automountServiceAccountToken: true
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: tfo-agent
          image: {{ include "tfo-agent.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.kubernetesCollectorSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - --config=/etc/tfo-agent/tfo-agent.yaml
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CLUSTER_NAME
              value: {{ .Values.kubernetesCollector.clusterName | default .Values.clusterName | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            # Auth + endpoint — read by Viper via explicit env bindings
            - name: TELEMETRYFLOW_ENDPOINT
              value: {{ required "telemetryflow.endpoint is required" .Values.telemetryflow.endpoint | quote }}
            - name: TELEMETRYFLOW_API_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "tfo-agent.secretName" . }}
                  key: TELEMETRYFLOW_API_KEY_ID
            - name: TELEMETRYFLOW_API_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "tfo-agent.secretName" . }}
                  key: TELEMETRYFLOW_API_KEY_SECRET
            {{- if .Values.telemetryflow.workspaceId }}
            - name: TELEMETRYFLOW_WORKSPACE_ID
              value: {{ .Values.telemetryflow.workspaceId | quote }}
            {{- end }}
            {{- if .Values.telemetryflow.tenantId }}
            - name: TELEMETRYFLOW_TENANT_ID
              value: {{ .Values.telemetryflow.tenantId | quote }}
            {{- end }}
            # Per-workload collector toggles
            - name: TELEMETRYFLOW_K8S_ENABLED
              value: "true"
            - name: TELEMETRYFLOW_NODE_EXPORTER_ENABLED
              value: "false"
            # Kubernetes cluster identity
            {{- $provider := .Values.kubernetesCollector.clusterProvider }}
            {{- if $provider }}
            - name: TELEMETRYFLOW_K8S_CLUSTER_PROVIDER
              value: {{ $provider | quote }}
            {{- end }}
            - name: TELEMETRYFLOW_K8S_CLUSTER_NAME
              value: {{ .Values.kubernetesCollector.clusterName | default .Values.clusterName | quote }}
            # Prometheus /metrics server
            - name: TELEMETRYFLOW_PROMETHEUS_ENABLED
              value: "true"
            - name: TELEMETRYFLOW_PROMETHEUS_PORT
              value: {{ .Values.ports.metrics | quote }}
            {{- if .Values.agentApi.enabled }}
            - name: TELEMETRYFLOW_AGENT_API_ENABLED
              value: "true"
            - name: TELEMETRYFLOW_AGENT_API_PORT
              value: {{ .Values.agentApi.port | default 8889 | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.ports.metrics }}
              name: metrics
              protocol: TCP
            {{- if .Values.agentApi.enabled }}
            - containerPort: {{ .Values.agentApi.port | default 8889 }}
              name: agent-api
              protocol: TCP
            {{- end }}
          # startupProbe: 90s budget for first-boot cluster auto-registration call
          startupProbe:
            httpGet:
              path: /metrics
              port: {{ .Values.ports.metrics }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /metrics
              port: {{ .Values.ports.metrics }}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: {{ .Values.ports.metrics }}
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.kubernetesCollector.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/tfo-agent
              readOnly: true
            - name: buffer
              mountPath: /var/lib/tfo-agent/buffer
      volumes:
        - name: config
          configMap:
            name: {{ include "tfo-agent.k8sConfigMapName" . }}
        - name: buffer
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "tfo-agent.fullname" . }}-k8s
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "tfo-agent.k8sCollector.selectorLabels" . | nindent 6 }}
{{- end }}
{{- end }}
