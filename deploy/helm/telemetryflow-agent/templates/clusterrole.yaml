{{- if .Values.serviceAccount.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "tfo-agent.fullname" . }}
  labels:
    {{- include "tfo-agent.labels" . | nindent 4 }}
rules:
  # Core resources — read-only access for cluster inventory and metrics
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/metrics
      - nodes/stats
      - nodes/proxy
      - pods
      - namespaces
      - services
      - endpoints
      - persistentvolumes
      - persistentvolumeclaims
      - events
      - replicationcontrollers
      - resourcequotas
      - limitranges
    verbs: ["get", "list", "watch"]

  # Apps resources
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]

  # Batch resources
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]

  # Autoscaling
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch"]

  # Networking
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch"]

  # Gateway API (NGINX Gateway Fabric / any GatewayClass) — optional CRDs
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      - gateways
      - httproutes
      - grpcroutes
      - tlsroutes
      - gatewayclasses
      - referencegrants
    verbs: ["get", "list", "watch"]

  # Storage
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
    verbs: ["get", "list", "watch"]

  # Metrics API (metrics-server)
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - nodes
      - pods
    verbs: ["get", "list"]

  # Pod logs (for pod_logs collector)
  - apiGroups: [""]
    resources:
      - pods/log
    verbs: ["get", "list"]

  # Policy resources (PDB)
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["get", "list", "watch"]

  # Discovery (EndpointSlices)
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs: ["get", "list", "watch"]

  # Non-resource URLs (metrics, healthz, cAdvisor)
  - nonResourceURLs:
      - /metrics
      - /metrics/cadvisor
      - /healthz
      - /readyz
    verbs: ["get"]
{{- end }}
